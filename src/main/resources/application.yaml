spring:
  application:
    name: firstpages-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_batch_fetch_size: 100

        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

  flyway:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
